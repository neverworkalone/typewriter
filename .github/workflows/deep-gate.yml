name: Deep CI Gate

on:
  pull_request:

permissions:
  contents: read

jobs:
  classify:
    name: Classify Deep coverage
    runs-on: ubuntu-24.04
    outputs:
      run_deep: ${{ steps.classify.outputs.run_deep }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Classify changed paths against Deep contracts
        id: classify
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          node scripts/ci/deep-gate.mjs "$BASE_SHA" "$HEAD_SHA"

  validate:
    name: Exact-head Deep validation
    needs: classify
    if: ${{ always() && (needs.classify.result != 'success' || needs.classify.outputs.run_deep == 'true') }}
    runs-on: ubuntu-24.04

    steps:
      - name: Check out pull request HEAD
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install pinned dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Exact-head Deep CI Gate (Normal + current Deep)
        run: pnpm run ci:all
