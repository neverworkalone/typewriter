name: GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build and validate Pages artifact
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.x
          cache: npm

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build web product at the repository Pages path
        run: npm run build:web
        env:
          TYPEWRITER_WEB_BASE_PATH: /typewriter/

      - name: Validate artifact allowlist and provenance
        run: npm run validate:pages-artifact
        env:
          TYPEWRITER_EXPECTED_SOURCE_REVISION: ${{ github.sha }}

      - name: Upload validated Pages artifact
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist-web
          retention-days: 1

  deploy:
    name: Deploy Pages artifact
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-24.04
    needs: build
    permissions:
      actions: read
      id-token: write
      pages: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
