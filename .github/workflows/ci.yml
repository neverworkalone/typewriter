name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and test Typewriter
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          paths_file="$(mktemp)"
          trap 'rm -f "$paths_file"' EXIT

          # Use the PR merge base, not the checked-out synthetic merge commit.
          # Disable renames so moving code into docs/ cannot hide a source-file deletion.
          git diff --no-renames --name-only -z "${BASE_SHA}...${HEAD_SHA}" > "$paths_file"
          # Read NUL-delimited paths (including whitespace safely); Bash 3.2 compatible.
          docs_only=true
          stage1_only=true
          saw_file=false
          while IFS= read -r -d '' file; do
            saw_file=true
            case "$file" in
              docs/*.md|README.md|REVIEW.md|AGENTS.md|CLAUDE.md) ;;
              *) docs_only=false ;;
            esac
            case "$file" in
              data/candidates/C[0-9][0-9][0-9][0-9][0-9][0-9]/manifest.json|data/candidates/C[0-9][0-9][0-9][0-9][0-9][0-9]/candidates.jsonl) ;;
              *) stage1_only=false ;;
            esac
          done < "$paths_file"

          # Only pure Stage 1 candidate artifacts get the fast gate.
          # Mixed changes, empty diffs, and all other PRs keep the normal gate.
          if [[ "$saw_file" != true ]]; then
            run_level=normal
          elif [[ "$docs_only" == true ]]; then
            run_level=none
          elif [[ "$stage1_only" == true ]]; then
            run_level=fast
          else
            run_level=normal
          fi

          echo "run_level=$run_level" >> "$GITHUB_OUTPUT"
          case "$run_level" in
            none) echo "Documentation-only PR: CI checks intentionally skipped." >> "$GITHUB_STEP_SUMMARY" ;;
            fast) echo "Stage 1 candidate-only PR: running ci:fast." >> "$GITHUB_STEP_SUMMARY" ;;
            normal) echo "Full ci:normal required for this PR." >> "$GITHUB_STEP_SUMMARY" ;;
          esac

      - name: Set up pnpm
        if: steps.changes.outputs.run_level != 'none'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: steps.changes.outputs.run_level != 'none'
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install pinned dependencies
        if: steps.changes.outputs.run_level != 'none'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Fast validation (Stage 1 candidates only)
        if: steps.changes.outputs.run_level == 'fast'
        run: pnpm run ci:fast

      - name: Normal validation (fast checkpoint + continuation)
        if: steps.changes.outputs.run_level == 'normal'
        run: pnpm run ci:normal
