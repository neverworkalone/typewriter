name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and test Typewriter
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify changed files
        id: changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          paths_file="$(mktemp)"
          trap 'rm -f "$paths_file"' EXIT

          # Use the PR merge base, not the checked-out synthetic merge commit.
          # Disable renames so moving code into docs/ cannot hide a source-file deletion.
          git diff --no-renames --name-only -z "${BASE_SHA}...${HEAD_SHA}" > "$paths_file"
          # Read NUL-delimited paths (including whitespace safely); Bash 3.2 compatible.
          run_normal=false
          saw_file=false
          while IFS= read -r -d '' file; do
            saw_file=true
            case "$file" in
              docs/*|README.md|REVIEW.md) ;;
              *) run_normal=true; break ;;
            esac
          done < "$paths_file"

          # Empty or unclassifiable diffs must run full CI.
          if [[ "$saw_file" != true ]]; then
            run_normal=true
          fi

          echo "run_normal=$run_normal" >> "$GITHUB_OUTPUT"
          if [[ "$run_normal" == true ]]; then
            echo "Full ci:normal required for this PR." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Documentation-only PR: ci:normal intentionally skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up pnpm
        if: steps.changes.outputs.run_normal == 'true'
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        if: steps.changes.outputs.run_normal == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 22.13.x
          cache: pnpm

      - name: Install pinned dependencies
        if: steps.changes.outputs.run_normal == 'true'
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Normal validation (fast checkpoint + continuation)
        if: steps.changes.outputs.run_normal == 'true'
        run: pnpm run ci:normal

      # node:sqlite in Node 22.13 ships without FTS5, so the literature index
      # regressions skip there. Run them on a Node whose SQLite has FTS5 and
      # fail if any is skipped.
      - name: Literature index regressions with FTS5 (no skips allowed)
        if: steps.changes.outputs.run_normal == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24.x

      - name: Run literature index regressions
        if: steps.changes.outputs.run_normal == 'true'
        env:
          TYPEWRITER_REQUIRE_FTS5: '1'
        run: node --test scripts/reference/literature-index.test.mjs
