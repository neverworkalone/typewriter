name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and test Typewriter
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - name: Classify changed files
        id: changes
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          paths_file="$(mktemp)"
          trap 'rm -f "$paths_file"' EXIT

          # Use the PR merge base, not the checked-out synthetic merge commit.
          # Disable renames so moving code into docs/ cannot hide a source-file deletion.
          git diff --no-renames --name-only -z "${BASE_SHA}...${HEAD_SHA}" > "$paths_file"
          # Read NUL-delimited paths (including whitespace safely); Bash 3.2 compatible.
          docs_only=true
          stage1_only=true
          saw_file=false
          while IFS= read -r -d '' file; do
            saw_file=true
            case "$file" in
              docs/*|README.md|REVIEW.md) ;;
              *) docs_only=false ;;
            esac
            case "$file" in
              data/candidates/C[0-9][0-9][0-9][0-9][0-9][0-9]/manifest.json|data/candidates/C[0-9][0-9][0-9][0-9][0-9][0-9]/candidates.jsonl) ;;
              *) stage1_only=false ;;
            esac
          done < "$paths_file"

          # Only pure Stage 1 candidate artifacts get the candidate-only gate.
          # Mixed changes, empty diffs, and all other PRs keep the normal gate.
          if [[ "$saw_file" != true ]]; then
            run_level=normal
          elif [[ "$docs_only" == true ]]; then
            run_level=none
          elif [[ "$stage1_only" == true ]]; then
            run_level=candidates
          else
            run_level=normal
          fi

          echo "run_level=$run_level" >> "$GITHUB_OUTPUT"
          echo "Changed-path classification: $run_level." >> "$GITHUB_STEP_SUMMARY"
          # The Deep path decision stays inside this PR check; it is not a separate check run.
          if ! node scripts/ci/deep-gate.mjs "$BASE_SHA" "$HEAD_SHA"; then
            echo "Deep path classification failed; running ci:all fail-closed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          run_deep="$(sed -n 's/^run_deep=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          if [[ "$run_deep" == true ]]; then
            echo "Running exact-head ci:all (Normal + current Deep) inside this PR check." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$run_level" == none ]]; then
            echo "Documentation-only PR: ci:normal skipped; no Deep input changed." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$run_level" == candidates ]]; then
            echo "Pure Stage 1 candidate artifacts: running ci:candidates." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Ordinary PR changes: running ci:normal." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install pinned dependencies
        if: ${{ steps.changes.outcome != 'success' || steps.changes.outputs.run_level != 'none' || steps.changes.outputs.run_deep == 'true' }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Candidate validation (Stage 1 artifacts only)
        if: ${{ steps.changes.outcome == 'success' && steps.changes.outputs.run_level == 'candidates' && steps.changes.outputs.run_deep != 'true' }}
        run: pnpm run ci:candidates

      - name: Normal validation (fast checkpoint + continuation)
        if: ${{ steps.changes.outcome == 'success' && steps.changes.outputs.run_level == 'normal' && steps.changes.outputs.run_deep != 'true' }}
        run: pnpm run ci:normal

      - name: Deep validation (Normal + current Deep)
        if: ${{ steps.changes.outcome != 'success' || steps.changes.outputs.run_deep == 'true' }}
        run: pnpm run ci:all
