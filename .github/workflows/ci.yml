name: CI

on:
  pull_request:
  merge_group:
    types: [checks_requested]
    branches: [master]
  push:
    branches: [master]
    paths:
      - 'data/relations/relation-*.jsonl'

permissions:
  contents: read

jobs:
  validate:
    name: Validate and test Typewriter
    if: ${{ github.event_name == 'pull_request' || github.event_name == 'merge_group' }}
    runs-on: ubuntu-24.04
    env:
      EVENT_NAME: ${{ github.event_name }}
      INTEGRATION_BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
      INTEGRATION_HEAD_SHA: ${{ github.sha }}
      PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
      PULL_REQUEST_HEAD_SHA: ${{ github.event.pull_request.head.sha }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          # Dependency cache is configured below, only when dependencies install.
          package-manager-cache: false

      - name: Resolve exact changed-path range
        id: revisions
        run: node scripts/ci/changed-files.mjs resolve

      - name: Validate changed Relation shards on the integration candidate
        run: node scripts/ci/relation-merge-check.mjs "$INTEGRATION_BASE_SHA" "$INTEGRATION_HEAD_SHA"

      - name: Classify exact SQL schema diff
        id: schema
        shell: bash
        env:
          CHANGE_BASE_SHA: ${{ steps.revisions.outputs.change_base_sha }}
          CHANGE_HEAD_SHA: ${{ steps.revisions.outputs.change_head_sha }}
        run: node scripts/ci/sqlite-schema-change.mjs "$CHANGE_BASE_SHA" "$CHANGE_HEAD_SHA"

      - name: Classify changed files
        id: changes
        continue-on-error: true
        shell: bash
        env:
          CHANGE_BASE_SHA: ${{ steps.revisions.outputs.change_base_sha }}
          CHANGE_HEAD_SHA: ${{ steps.revisions.outputs.change_head_sha }}
        run: |
          set -euo pipefail
          node scripts/ci/changed-files.mjs classify "$CHANGE_BASE_SHA" "$CHANGE_HEAD_SHA"
          run_level="$(sed -n 's/^run_level=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          # Deep impact and exact-check selection stay inside this PR check.
          if ! TYPEWRITER_CI_RUN_LEVEL="$run_level" TYPEWRITER_CI_VALIDATION_HEAD="$INTEGRATION_HEAD_SHA" node scripts/ci/deep-gate.mjs "$CHANGE_BASE_SHA" "$CHANGE_HEAD_SHA"; then
            echo "Deep path classification failed; running ci:normal fallback." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          run_deep="$(sed -n 's/^run_deep=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          deep_mode="$(sed -n 's/^deep_mode=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          if [[ "$deep_mode" == selective ]]; then
            echo "Running exact-head ci:pr (Normal + affected Deep checks) inside this PR check." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$run_level" == none ]]; then
            echo "Documentation-only PR: ci:normal skipped; no Deep contract dependency changed." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$run_level" == warroom ]]; then
            echo "War Room-only PR: War Room Python tests required; product ci:normal skipped." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Ordinary PR changes: running ci:normal." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up pnpm
        if: ${{ steps.changes.outcome != 'success' || steps.changes.outputs.run_level == 'normal' || steps.changes.outputs.run_deep == 'true' || steps.schema.outputs.schema_changed == 'true' }}
        uses: pnpm/action-setup@v6

      - name: Set up pnpm dependency cache
        if: ${{ steps.changes.outcome != 'success' || steps.changes.outputs.run_level == 'normal' || steps.changes.outputs.run_deep == 'true' || steps.schema.outputs.schema_changed == 'true' }}
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - name: Install pinned dependencies
        if: ${{ steps.changes.outcome != 'success' || steps.changes.outputs.run_level == 'normal' || steps.changes.outputs.run_deep == 'true' || steps.schema.outputs.schema_changed == 'true' }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Build extension UI assets without a dictionary database
        id: ui-build
        if: ${{ steps.changes.outcome != 'success' || steps.changes.outputs.run_ui_build == 'true' }}
        run: pnpm run build:ui

      - name: Build Typewriter Web and validate the Pages artifact
        id: web-build
        if: ${{ steps.changes.outcome != 'success' || steps.changes.outputs.run_web_build == 'true' }}
        run: pnpm run build:web && pnpm run validate:pages-artifact

      - name: War Room Python unit tests
        id: warroom
        if: ${{ always() && steps.changes.outcome == 'success' && steps.changes.outputs.run_warroom_tests == 'true' }}
        run: node tools/warroom/run-tests.mjs

      - name: Normal validation (fast checkpoint + continuation)
        id: normal
        if: ${{ steps.changes.outcome != 'success' || (steps.changes.outputs.run_level == 'normal' && steps.changes.outputs.deep_mode != 'selective') }}
        env:
          BASE_SHA: ${{ steps.revisions.outputs.change_base_sha }}
          HEAD_SHA: ${{ steps.revisions.outputs.change_head_sha }}
        run: pnpm run ci:normal

      - name: Selective Deep validation (Normal + affected current Deep)
        id: selective
        if: ${{ steps.changes.outcome == 'success' && steps.changes.outputs.deep_mode == 'selective' }}
        env:
          CHANGE_BASE_SHA: ${{ steps.revisions.outputs.change_base_sha }}
          CHANGE_HEAD_SHA: ${{ steps.revisions.outputs.change_head_sha }}
        run: pnpm run ci:pr -- --base "$CHANGE_BASE_SHA" --head "$CHANGE_HEAD_SHA" --validation-head "$INTEGRATION_HEAD_SHA"

      - name: SQL schema-only Full/Lite build and validation
        id: schema-build
        if: ${{ steps.schema.outputs.schema_changed == 'true' }}
        run: pnpm run ci:schema

      - name: Require complete changed-path evidence
        if: always()
        env:
          CLASSIFIER_OUTCOME: ${{ steps.changes.outcome }}
          CHANGED_PATHS_COMPLETE: ${{ steps.changes.outputs.changed_paths_complete }}
          RUN_LEVEL: ${{ steps.changes.outputs.run_level }}
          DEEP_MODE: ${{ steps.changes.outputs.deep_mode }}
          WARROOM_OUTCOME: ${{ steps.warroom.outcome }}
          NORMAL_OUTCOME: ${{ steps.normal.outcome }}
          SELECTIVE_OUTCOME: ${{ steps.selective.outcome }}
          SCHEMA_CHANGED: ${{ steps.schema.outputs.schema_changed }}
          RUN_UI_BUILD: ${{ steps.changes.outputs.run_ui_build }}
          UI_BUILD_OUTCOME: ${{ steps.ui-build.outcome }}
          RUN_WEB_BUILD: ${{ steps.changes.outputs.run_web_build }}
          WEB_BUILD_OUTCOME: ${{ steps.web-build.outcome }}
        shell: bash
        run: |
          if [[ "$CLASSIFIER_OUTCOME" != success || "$CHANGED_PATHS_COMPLETE" != true ]]; then
            echo "Changed-path evidence is incomplete; Normal fallback ran, but this PR check cannot pass." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$RUN_UI_BUILD" == true && "$UI_BUILD_OUTCOME" != success ]]; then
            echo "A src/** change requires a successful extension UI build." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$RUN_WEB_BUILD" == true && "$WEB_BUILD_OUTCOME" != success ]]; then
            echo "A site/** change requires a successful Web build and Pages validation." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          if [[ "$RUN_LEVEL" == warroom ]]; then
            if [[ "$WARROOM_OUTCOME" != success || "$SCHEMA_CHANGED" == true ]]; then
              echo "War Room-only exemption requires successful War Room tests and no SQL schema change." >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            if [[ "$DEEP_MODE" == selective ]]; then
              [[ "$SELECTIVE_OUTCOME" == success ]] || exit 1
            else
              if [[ "$NORMAL_OUTCOME" != skipped || "$SELECTIVE_OUTCOME" != skipped ]]; then
                echo "Unexpected product/Deep CI gate for a War Room-only change." >> "$GITHUB_STEP_SUMMARY"
                exit 1
              fi
            fi
          fi

      - name: Record executed CI gate
        if: always()
        env:
          CLASSIFIER_OUTCOME: ${{ steps.changes.outcome }}
          RUN_LEVEL: ${{ steps.changes.outputs.run_level }}
          DEEP_MODE: ${{ steps.changes.outputs.deep_mode }}
          SCHEMA_GATE: ${{ steps.schema.outputs.schema_changed }}
          SCHEMA_OUTCOME: ${{ steps.schema-build.outcome }}
          NORMAL_OUTCOME: ${{ steps.normal.outcome }}
          SELECTIVE_OUTCOME: ${{ steps.selective.outcome }}
          WARROOM_OUTCOME: ${{ steps.warroom.outcome }}
          UI_BUILD_SELECTED: ${{ steps.changes.outputs.run_ui_build }}
          UI_BUILD_OUTCOME: ${{ steps.ui-build.outcome }}
          WEB_BUILD_SELECTED: ${{ steps.changes.outputs.run_web_build }}
          WEB_BUILD_OUTCOME: ${{ steps.web-build.outcome }}
          FINAL_GATE: ${{ job.status }}
          PATH_BASE_SHA: ${{ steps.revisions.outputs.change_base_sha }}
          PATH_HEAD_SHA: ${{ steps.revisions.outputs.change_head_sha }}
          INTEGRATION_HEAD_SHA: ${{ github.sha }}
        shell: bash
        run: |
          {
            echo "## Executed PR CI gate"
            echo "- Path-selection range: ${PATH_BASE_SHA:-unavailable}...${PATH_HEAD_SHA:-unavailable}"
            echo "- Integration validation checkout: ${INTEGRATION_HEAD_SHA:-unavailable}"
            echo "- Classifier: ${CLASSIFIER_OUTCOME:-unknown}"
            echo "- Base gate class: ${RUN_LEVEL:-unknown}"
            echo "- Deep selection mode: ${DEEP_MODE:-Normal fallback}"
            echo "- SQL schema build gate required: ${SCHEMA_GATE:-unknown}"
            echo "- SQL schema build gate outcome: ${SCHEMA_OUTCOME:-skipped}"
            echo "- War Room gate outcome: ${WARROOM_OUTCOME:-skipped}"
            echo "- Extension UI build selected/outcome: ${UI_BUILD_SELECTED:-unknown} / ${UI_BUILD_OUTCOME:-skipped}"
            echo "- Web build and Pages validation selected/outcome: ${WEB_BUILD_SELECTED:-unknown} / ${WEB_BUILD_OUTCOME:-skipped}"
            echo "- Normal-only gate outcome: ${NORMAL_OUTCOME:-skipped}"
            echo "- Selective Deep gate outcome: ${SELECTIVE_OUTCOME:-skipped}"
            echo "- Final gate result: ${FINAL_GATE:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"

  post-merge-relations:
    name: Verify merged Relation integrity
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-24.04
    steps:
      - name: Check out pushed revision
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          package-manager-cache: false

      - name: Verify latest master after merge
        shell: bash
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          git fetch origin master
          latest_master="$(git rev-parse origin/master)"
          if ! git merge-base --is-ancestor "$EVENT_AFTER" "$latest_master"; then
            echo "Pushed revision $EVENT_AFTER is not an ancestor of latest master $latest_master." >&2
            exit 1
          fi
          git checkout --detach "$latest_master"
          if [[ "$EVENT_BEFORE" =~ ^0{40}$ ]]; then
            base_sha="$(git rev-parse "$latest_master^" 2>/dev/null || true)"
          else
            base_sha="$EVENT_BEFORE"
          fi
          if [[ ! "$base_sha" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Cannot identify a valid pre-push base for relation integrity verification." >&2
            exit 1
          fi
          node scripts/ci/relation-merge-check.mjs "$base_sha" "$latest_master"
