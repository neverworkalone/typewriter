name: CI

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and test Typewriter
    runs-on: ubuntu-24.04

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: pnpm

      - name: Classify changed files
        id: changes
        continue-on-error: true
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          paths_file="$(mktemp)"
          trap 'rm -f "$paths_file"' EXIT

          # Use the PR merge base, not the checked-out synthetic merge commit.
          # Disable renames so moving code into docs/ cannot hide a source-file deletion.
          git diff --no-renames --name-only -z "${BASE_SHA}...${HEAD_SHA}" > "$paths_file"
          # Read NUL-delimited paths (including whitespace safely); Bash 3.2 compatible.
          docs_only=true
          stage1_only=true
          saw_file=false
          while IFS= read -r -d '' file; do
            saw_file=true
            case "$file" in
              docs/*|README.md|REVIEW.md) ;;
              *) docs_only=false ;;
            esac
            case "$file" in
              data/candidates/C[0-9][0-9][0-9][0-9][0-9][0-9]/manifest.json|data/candidates/C[0-9][0-9][0-9][0-9][0-9][0-9]/candidates.jsonl|data/candidates/C[0-9][0-9][0-9][0-9][0-9][0-9]/stage1-decisions.json) ;;
              *) stage1_only=false ;;
            esac
          done < "$paths_file"

          # Only pure Stage 1 candidate artifacts get the candidate-only gate.
          # Mixed changes, empty diffs, and all other PRs keep the normal gate.
          if [[ "$saw_file" != true ]]; then
            run_level=normal
          elif [[ "$docs_only" == true ]]; then
            run_level=none
          elif [[ "$stage1_only" == true ]]; then
            run_level=candidates
          else
            run_level=normal
          fi

          echo "run_level=$run_level" >> "$GITHUB_OUTPUT"
          echo "Changed-path classification: $run_level." >> "$GITHUB_STEP_SUMMARY"
          # Deep impact and exact-check selection stay inside this PR check.
          if ! TYPEWRITER_CI_RUN_LEVEL="$run_level" node scripts/ci/deep-gate.mjs "$BASE_SHA" "$HEAD_SHA"; then
            echo "Deep path classification failed; running ci:all fail-closed." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          run_deep="$(sed -n 's/^run_deep=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          deep_mode="$(sed -n 's/^deep_mode=//p' "$GITHUB_OUTPUT" | tail -n 1)"
          if [[ "$deep_mode" == full ]]; then
            echo "Running exact-head ci:all (Normal + all current Deep) inside this PR check." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$deep_mode" == selective ]]; then
            echo "Running exact-head ci:pr (Normal + affected Deep checks) inside this PR check." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$run_level" == none ]]; then
            echo "Documentation-only PR: ci:normal skipped; no Deep contract dependency changed." >> "$GITHUB_STEP_SUMMARY"
          elif [[ "$run_level" == candidates ]]; then
            echo "Pure Stage 1 candidate artifacts: running ci:candidates." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Ordinary PR changes: running ci:normal." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Install pinned dependencies
        if: ${{ steps.changes.outcome != 'success' || steps.changes.outputs.run_level != 'none' || steps.changes.outputs.run_deep == 'true' }}
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Candidate validation (Stage 1 artifacts only)
        id: candidates
        if: ${{ steps.changes.outputs.run_level == 'candidates' }}
        run: pnpm run ci:candidates

      - name: Normal validation (fast checkpoint + continuation)
        id: normal
        if: ${{ steps.changes.outcome == 'success' && steps.changes.outputs.run_level == 'normal' && steps.changes.outputs.run_deep != 'true' }}
        run: pnpm run ci:normal

      - name: Selective Deep validation (Normal + affected current Deep)
        id: selective
        if: ${{ steps.changes.outcome == 'success' && steps.changes.outputs.deep_mode == 'selective' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: pnpm run ci:pr -- --base "$BASE_SHA" --head "$HEAD_SHA"

      - name: Full Deep validation (Normal + all current Deep)
        id: full_deep
        if: ${{ steps.changes.outcome != 'success' || steps.changes.outputs.deep_mode == 'full' }}
        run: pnpm run ci:all

      - name: Record executed CI gate
        if: always()
        env:
          CLASSIFIER_OUTCOME: ${{ steps.changes.outcome }}
          RUN_LEVEL: ${{ steps.changes.outputs.run_level }}
          DEEP_MODE: ${{ steps.changes.outputs.deep_mode }}
          CANDIDATE_OUTCOME: ${{ steps.candidates.outcome }}
          NORMAL_OUTCOME: ${{ steps.normal.outcome }}
          SELECTIVE_OUTCOME: ${{ steps.selective.outcome }}
          FULL_DEEP_OUTCOME: ${{ steps.full_deep.outcome }}
          FINAL_GATE: ${{ job.status }}
        shell: bash
        run: |
          {
            echo "## Executed PR CI gate"
            echo "- Classifier: ${CLASSIFIER_OUTCOME:-unknown}"
            echo "- Base gate class: ${RUN_LEVEL:-unknown}"
            echo "- Deep selection mode: ${DEEP_MODE:-full fallback}"
            echo "- Candidate gate outcome: ${CANDIDATE_OUTCOME:-skipped}"
            echo "- Normal-only gate outcome: ${NORMAL_OUTCOME:-skipped}"
            echo "- Selective Deep gate outcome: ${SELECTIVE_OUTCOME:-skipped}"
            echo "- Full Deep gate outcome: ${FULL_DEEP_OUTCOME:-skipped}"
            echo "- Final gate result: ${FINAL_GATE:-unknown}"
          } >> "$GITHUB_STEP_SUMMARY"
