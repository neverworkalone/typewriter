name: CI

on:
  pull_request:
  push:
    branches:
      - master
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Validate and test Typewriter
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.x

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Pull request normal validation (fast checkpoint + continuation)
        if: ${{ github.event_name == 'pull_request' }}
        run: npm run ci:normal

      - name: Master normal validation
        if: ${{ github.event_name == 'push' }}
        run: npm run ci:normal

      - name: Scheduled/manual all validation
        if: ${{ github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' }}
        run: npm run ci:all
