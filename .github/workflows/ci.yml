name: CI

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

jobs:
  validate:
    name: Validate canonical JSONL
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.13.x

      - name: Install pinned dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate manifest version
        shell: bash
        run: |
          node -e '
            const fs = require("node:fs");
            const manifest = JSON.parse(fs.readFileSync("public/manifest.json", "utf8"));
            if (typeof manifest.version !== "string" || manifest.version.length === 0) process.exit(1);
          '

      - name: Validate canonical JSONL
        run: node scripts/validate/canonical-jsonl.mjs

      - name: Run validator tests
        run: node --test tests/validate-canonical-jsonl.test.mjs

      - name: Validate dataset integrity
        run: node scripts/validate/dataset-integrity.mjs

      - name: Run dataset validator tests
        run: node --test tests/validate-dataset-integrity.test.mjs

      - name: Validate M5 target inventory
        run: node scripts/validate/target-inventory.mjs

      - name: Run target inventory tests
        run: node --test tests/target-inventory.test.mjs

      - name: Validate lexical rule inventory
        run: npm run validate:rules

      - name: Run lexical rule inventory tests
        run: node --test tests/lexical-rule-inventory.test.mjs

      - name: Validate shared lexical quality and semantic audit
        run: npm run validate:lexical

      - name: Run shared lexical quality tests
        run: node --test tests/lexical-quality.test.mjs

      - name: Run batch workflow tests
        run: node --test tests/batch-workflow.test.mjs

      - name: Validate M5-8 process contract
        run: npm run batch:process:check

      - name: Validate M5-9A repair authorization
        run: npm run batch:repair:check

      - name: Validate M5-10A candidate-generation calibration
        run: npm run batch:m5-10a:calibration:check

      - name: Validate M5-10A process correction
        run: npm run batch:m5-10a:process:check

      - name: Validate M5-10A repair authorization
        run: npm run batch:m5-10a:repair:check

      - name: Run M5-10C recovery contract tests
        run: npm run batch:m5-10c:contract:check

      - name: Validate M5-10C recovery and authorization contract
        run: npm run batch:m5-10c:recovery:contract:check

      - name: Run M5-10D workload contract tests
        run: npm run batch:m5-10d:contract:check

      - name: Validate M5-10D recovery and authorization contract
        run: npm run batch:m5-10d:recovery:contract:check

      - name: Validate committed M5-10D recovery artifact
        run: npm run batch:m5-10d:recovery:check

      - name: Validate committed M5-10D authorization artifact
        run: npm run batch:m5-10d:authorization:check

      - name: Materialize the committed Wave A2 review shard
        shell: bash
        run: cp data/canonical/m5-10a-wave-a2.jsonl "$RUNNER_TEMP/typewriter-m5-10a-wave-a2-reviewed.jsonl"

      - name: Materialize the committed Wave A2 semantic audit
        shell: bash
        run: cp data/validation/m5-10a-wave-a2-semantic-audit.json "$RUNNER_TEMP/typewriter-m5-10a-wave-a2-semantic-audit.json"

      - name: Validate M5-10A Wave A2 stage
        run: >-
          npm run batch:m5-10a:wave-a2:check --
          --staged="$RUNNER_TEMP/typewriter-m5-10a-wave-a2-reviewed.jsonl"
          --semantic-audit="$RUNNER_TEMP/typewriter-m5-10a-wave-a2-semantic-audit.json"
          --canonical-dir=data/batches/m5-10-wave-b-base-canonical
          --canonical-source-dir=data/canonical

      - name: Materialize the committed Wave B review shard
        shell: bash
        run: cp data/canonical/m5-10-wave-b.jsonl "$RUNNER_TEMP/typewriter-m5-10-wave-b-reviewed.jsonl"

      - name: Materialize the committed Wave B semantic audit
        shell: bash
        run: cp data/validation/m5-10-wave-b-semantic-audit.json "$RUNNER_TEMP/typewriter-m5-10-wave-b-semantic-audit.json"

      - name: Validate M5-10 Wave B stage
        run: >-
          npm run batch:m5-10:wave-b:check --
          --staged="$RUNNER_TEMP/typewriter-m5-10-wave-b-reviewed.jsonl"
          --semantic-audit="$RUNNER_TEMP/typewriter-m5-10-wave-b-semantic-audit.json"

      - name: Normalize canonical data
        run: node scripts/normalize/canonical.mjs

      - name: Run normalization tests
        run: node --test tests/normalize-canonical.test.mjs

      - name: Build SQLite dictionary
        run: node scripts/build/dictionary.mjs

      - name: Run integrated M2 audit
        run: node scripts/verify/m2-pipeline.mjs

      - name: Run toolchain tests
        run: node --test tests/*.test.mjs

      - name: Run product unit tests
        run: npm run test:unit

      # Pre-1.0 CI intentionally ends at the product build. Release verification
      # remains available for manual runs and future release automation.
      - name: Build product extension
        run: npm run build
